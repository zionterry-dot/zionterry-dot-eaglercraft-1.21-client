<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eaglercraft Client</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Eaglercraft Client</h1>
        </header>
        <nav class="main-menu">
            <ul>
                <li><a href="#launch">Launch Game</a></li>
                <li><a href="#settings">Settings</a></li>
                <li><a href="#support">Support</a></li>
            </ul>
        </nav>
        <section id="launch">
            <h2>Game Launcher</h2>
            <button class="launch-btn">Start</button>
        </section>
        <section id="settings">
            <h2>Settings</h2>
            <div class="setting-item">
                <label for="hide-icon-name">Hide Icon/Name:</label>
                <input type="checkbox" id="hide-icon-name">
            </div>
        </section>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
