<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epic Gaming Launcher</title>
    <style>
        body {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            animation: backgroundAnimation 10s infinite;
        }
        @keyframes backgroundAnimation {
            0% { background: rgba(0, 0, 0, 0.8); }
            50% { background: rgba(255, 0, 255, 0.8); }
            100% { background: rgba(0, 0, 0, 0.8); }
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h1 {
            color: neon;
        }
        .date-time {
            font-size: 1.2em;
            margin: 10px 0;
        }
        .login {
            font-size: 1em;
            color: #00ff00;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to the Epic Gaming Launcher</h1>
        <div class="date-time">Current Date and Time (UTC): 2026-03-24 14:09:59</div>
        <div class="login">Current User's Login: zionterry-dot</div>
    </div>
</body>
</html>
